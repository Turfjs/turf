name: CI build

on:
  push:
    branches:
      - master
      - support/6.x
      - support/7.x
  pull_request:
    branches:
      - master
      - support/6.x
      - support/7.x

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24, 26]
        exclude:
          # master (v8) removes [18, 20]
          - node-version: ${{ (github.base_ref || github.ref_name) == 'master' && 18 || '' }}
          - node-version: ${{ (github.base_ref || github.ref_name) == 'master' && 20 || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # 6.0.9
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          cache: "pnpm"
          node-version: ${{ matrix.node-version }}

      - run: pnpm install --frozen-lockfile
      - run: git diff --exit-code
      - run: pnpm test
